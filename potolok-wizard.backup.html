<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>potolok</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #0066FF;
            --primary-dark: #0052CC;
            --primary-light: #E6F2FF;
            --success: #00B341;
            --success-light: #E6F7ED;
            --warning: #FF8C00;
            --warning-light: #FFF4E6;
            --error: #FF3B30;
            --error-light: #FFEBEA;
            
            --bg: #FAFBFC;
            --surface: #FFFFFF;
            --surface-elevated: #FFFFFF;
            --border: #E1E5E9;
            --border-light: #F0F2F5;
            
            --text: #1D2129;
            --text-secondary: #606770;
            --text-tertiary: #8A919A;
            
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-xl: 0 16px 40px rgba(0,0,0,0.16);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow-x: hidden;
        }

        /* Progress indicator */
        .progress-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
        }

        .progress-bar {
            height: 4px;
            background: var(--border-light);
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 2px 2px 0;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            align-items: center;
        }

        .step-indicator {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
        }

        .back-btn, .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .back-btn:hover, .close-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .back-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        /* Main container */
        .main-container {
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        /* Step container */
        .step-container {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 0 20px 20px;
        }

        .step-container.active {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Step content */
        .step-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 24px;
        }

        .step-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .step-icon {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-lg);
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: var(--shadow-sm);
        }

        .step-icon svg {
            width: 28px;
            height: 28px;
            color: var(--primary);
        }

        .step-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .step-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.4;
            max-width: 320px;
            margin: 0 auto;
        }

        /* Preview area */
        .preview-area {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            margin: 24px 0;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-svg {
            width: 100%;
            height: 200px;
            overflow: visible;
        }

        .room-wall {
            stroke: var(--primary);
            stroke-width: 4;
            stroke-linecap: round;
            fill: none;
        }

        .room-corner {
            fill: var(--surface);
            stroke: var(--primary);
            stroke-width: 3;
        }

        .room-corner.active {
            fill: var(--primary);
            stroke: var(--primary-dark);
        }

        .room-corner.next {
            fill: var(--warning);
            stroke: var(--warning);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .room-label {
            fill: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            text-anchor: middle;
        }

        .room-dimension {
            fill: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-anchor: middle;
        }

        .diagonal-line {
            stroke: var(--warning);
            stroke-width: 2;
            stroke-dasharray: 6 4;
            fill: none;
        }

        /* Input section */
        .input-section {
            margin: 24px 0;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            height: 56px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 24px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            outline: none;
            transition: all 0.2s;
            background: var(--surface);
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .input-field.error {
            border-color: var(--error);
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .input-unit {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-hint {
            font-size: 13px;
            color: var(--text-tertiary);
            text-align: center;
            margin-top: 4px;
        }

        /* Corner selection */
        .corner-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
        }

        .corner-option {
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .corner-option:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .corner-option.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .corner-option.selected::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-md);
            z-index: -1;
        }

        .corner-visual {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .corner-visual svg {
            width: 100%;
            height: 100%;
        }

        .corner-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .corner-description {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .corner-option.selected .corner-title {
            color: var(--primary);
        }

        .corner-option.selected .corner-description {
            color: var(--primary);
        }

        /* Action buttons */
        .action-section {
            margin-top: auto;
            padding-top: 24px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            height: 52px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn.primary:disabled {
            background: var(--border);
            color: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn.secondary {
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn.secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Result display */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
        }

        .result-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .result-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .result-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Helper text */
        .helper-text {
            background: var(--primary-light);
            border: 1px solid rgba(0, 102, 255, 0.2);
            border-radius: var(--radius-md);
            padding: 16px;
            margin: 16px 0;
            font-size: 13px;
            color: var(--primary-dark);
            line-height: 1.4;
        }

        .helper-text .icon {
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
            line-height: 1.4;
        }

        /* Responsive adjustments */
        @media (max-width: 380px) {
            .step-title {
                font-size: 20px;
            }
            
            .input-field {
                font-size: 20px;
            }
            
            .corner-selection {
                gap: 12px;
            }
            
            .corner-option {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        const { createApp, ref, reactive, computed, watch, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                // State
                const currentStep = ref('first-wall');
                const stepIndex = ref(0);
                const walls = ref([]);
                const corners = ref([]);
                const diagonals = ref([]);
                const selectedCorner = ref(null);
                
                // Input values
                const firstWallInput = ref('');
                const nextWallInput = ref('');
                const diagonalInput = ref('');
                
                // Input errors
                const firstWallError = ref(false);
                const nextWallError = ref(false);
                const diagonalError = ref(false);
                
                // Computed
                const totalSteps = computed(() => Math.max(5, walls.value.length + 3));
                const progress = computed(() => {
                    return (stepIndex.value / totalSteps.value) * 100;
                });
                const canGoBack = computed(() => stepIndex.value > 0);
                
                const firstWallValid = computed(() => {
                    const value = parseFloat(firstWallInput.value);
                    return value >= 50 && value <= 2000;
                });
                
                const nextWallValid = computed(() => {
                    const value = parseFloat(nextWallInput.value);
                    return value >= 50 && value <= 2000;
                });
                
                const diagonalValid = computed(() => {
                    const value = parseFloat(diagonalInput.value);
                    return value >= 100 && value <= 3000;
                });
                
                const cornerSubtitle = computed(() => {
                    const wallNum = walls.value.length;
                    if (wallNum === 1) {
                        return `После стены с дверью (${walls.value[0]} см), какой угол образуется при повороте направо?`;
                    } else {
                        return `После ${wallNum}-й стены (${walls.value[wallNum-1]} см), какой угол образуется при повороте направо?`;
                    }
                });
                
                const nextWallTitle = computed(() => {
                    return `Стена №${walls.value.length + 1}`;
                });
                
                const nextWallSubtitle = computed(() => {
                    return `Измерьте ${walls.value.length + 1}-ю стену, продолжая движение по часовой стрелке`;
                });
                
                const showFinishFromCorner = computed(() => {
                    return walls.value.length >= 3;
                });
                
                const resultPerimeter = ref('0.00');
                const resultArea = ref('0.00');
                
                // SVG refs
                const firstWallPreview = ref(null);
                const cornerPreview = ref(null);
                const nextWallPreview = ref(null);
                const diagonalPreview = ref(null);
                const resultPreview = ref(null);
                
                // Methods
                function goToStep(stepName) {
                    const stepOrder = ['first-wall', 'corner-selection', 'next-wall', 'diagonal', 'result'];
                    const currentIndex = stepOrder.indexOf(currentStep.value);
                    const targetIndex = stepOrder.indexOf(stepName);
                    
                    if (targetIndex > currentIndex || stepIndex.value === 0) {
                        stepIndex.value = Math.max(stepIndex.value, targetIndex);
                    }
                    
                    currentStep.value = stepName;
                    
                    nextTick(() => {
                        switch(stepName) {
                            case 'first-wall':
                                drawFirstWallPreview(parseFloat(firstWallInput.value) || 250);
                                break;
                            case 'corner-selection':
                                drawCornerPreview(selectedCorner.value);
                                break;
                            case 'next-wall':
                                drawNextWallPreview(parseFloat(nextWallInput.value) || null);
                                break;
                            case 'diagonal':
                                drawDiagonalPreview(parseFloat(diagonalInput.value) || null);
                                break;
                            case 'result':
                        drawResultPreview();
                                break;
                        }
                        
                        const stepEl = document.querySelector(`[data-step="${stepName}"]`);
                        if (stepEl) {
                            const input = stepEl.querySelector('input');
                            if (input) input.focus();
                }
            });
        }

        function handleFirstWallInput() {
                    const value = parseFloat(firstWallInput.value);
                    if (firstWallInput.value && !firstWallValid.value) {
                        firstWallError.value = true;
                        setTimeout(() => firstWallError.value = false, 300);
                    } else {
                        firstWallError.value = false;
                        if (firstWallValid.value) {
                drawFirstWallPreview(value);
                        }
            }
        }

        function handleFirstWallNext() {
                    if (!firstWallValid.value) return;
                    const value = parseFloat(firstWallInput.value);
                    walls.value.push(value);
                    selectedCorner.value = null;
            goToStep('corner-selection');
                }
                
                function handleCornerSelection(type) {
                    selectedCorner.value = type;
                    nextTick(() => {
                        drawCornerPreview(type);
                    });
        }

        function handleCornerNext() {
                    if (!selectedCorner.value) return;
                    corners.value.push(selectedCorner.value);
                    const prevCorner = selectedCorner.value;
                    selectedCorner.value = null;
                goToStep('next-wall');
                }
                
                function handleFinishRoomFromCorner() {
                    if (walls.value.length >= 3) {
                        if (shouldAddDiagonal()) {
                            goToStep('diagonal');
                        } else {
                            calculateResults();
                            goToStep('result');
                        }
                    }
                }
                
        function handleNextWallInput() {
                    const value = parseFloat(nextWallInput.value);
                    if (nextWallInput.value && !nextWallValid.value) {
                        nextWallError.value = true;
                        setTimeout(() => nextWallError.value = false, 300);
                    } else {
                        nextWallError.value = false;
                        if (nextWallValid.value) {
                drawNextWallPreview(value);
                        }
            }
        }

        function handleNextWallNext() {
                    if (!nextWallValid.value) return;
                    const value = parseFloat(nextWallInput.value);
                    walls.value.push(value);
                    nextWallInput.value = '';
                    
                    if (walls.value.length >= 3) {
                        selectedCorner.value = null;
                goToStep('corner-selection');
            }
        }

        function handleFinishRoom() {
                    if (shouldAddDiagonal()) {
                goToStep('diagonal');
            } else {
                calculateResults();
                goToStep('result');
            }
        }

        function handleDiagonalInput() {
                    const value = parseFloat(diagonalInput.value);
                    if (diagonalInput.value && !diagonalValid.value) {
                        diagonalError.value = true;
                        setTimeout(() => diagonalError.value = false, 300);
                    } else {
                        diagonalError.value = false;
                        if (diagonalValid.value) {
                drawDiagonalPreview(value);
                        }
            }
        }

        function handleDiagonalNext() {
                    if (!diagonalValid.value) return;
                    const value = parseFloat(diagonalInput.value);
                    diagonals.value.push({
                from: 0,
                        to: Math.floor(walls.value.length / 2),
                length: value
            });
            calculateResults();
            goToStep('result');
        }

        function handleSkipDiagonal() {
            calculateResults();
            goToStep('result');
        }

        function handleBack() {
                    if (stepIndex.value > 0) {
                        stepIndex.value--;
                        
                        if (currentStep.value === 'corner-selection') {
                            selectedCorner.value = null;
                        goToStep('first-wall');
                        } else if (currentStep.value === 'next-wall') {
                            if (corners.value.length > 0) {
                                corners.value.pop();
                        }
                        goToStep('corner-selection');
                        } else if (currentStep.value === 'diagonal') {
                        goToStep('next-wall');
                        } else if (currentStep.value === 'result') {
                        if (shouldAddDiagonal()) {
                            goToStep('diagonal');
                        } else {
                            goToStep('next-wall');
                            }
                        }
                    }
                }
                
                function shouldAddDiagonal() {
                    return walls.value.length >= 4;
                }
                
                function calculateResults() {
                    const perimeter = walls.value.reduce((sum, wall) => sum + wall, 0);
                    resultPerimeter.value = (perimeter / 100).toFixed(2);
                    
                    let area = 0;
                    if (walls.value.length === 3) {
                        const [a, b, c] = walls.value;
                        const s = (a + b + c) / 2;
                        area = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c)));
                    } else if (walls.value.length === 4) {
                        area = walls.value[0] * walls.value[1];
            } else {
                        const avgWall = perimeter / walls.value.length;
                        area = (walls.value.length * avgWall * avgWall) / (4 * Math.tan(Math.PI / walls.value.length));
                    }
                    
                    resultArea.value = (area / 10000).toFixed(2);
                }
                
        function drawFirstWallPreview(length = 250) {
                    const svg = firstWallPreview.value;
                    if (!svg) return;
                    
            const scale = Math.min(200 / Math.max(length, 250), 1);
            const wallLength = length * scale;
            
            svg.innerHTML = `
                <g>
                    <line x1="50" y1="100" x2="${50 + wallLength}" y2="100" 
                          class="room-wall" stroke-width="6"/>
                    <rect x="${50 + wallLength * 0.3}" y="94" width="${wallLength * 0.2}" height="12" 
                          fill="white" stroke="#0066FF" stroke-width="2" rx="2"/>
                    <circle cx="50" cy="100" r="6" class="room-corner"/>
                    <circle cx="${50 + wallLength}" cy="100" r="6" class="room-corner"/>
                    <text x="50" y="125" class="room-label">A</text>
                    <text x="${50 + wallLength}" y="125" class="room-label">B</text>
                    <text x="${50 + wallLength/2}" y="85" class="room-dimension">${length} см</text>
                    <text x="${50 + wallLength * 0.4}" y="115" class="room-dimension">дверь</text>
                </g>
            `;
        }

        function drawCornerPreview(cornerType = null) {
                    const svg = cornerPreview.value;
                    if (!svg) return;
            
                    if (walls.value.length === 0) {
                svg.innerHTML = '<text x="150" y="100" text-anchor="middle" class="room-label">Сначала добавьте стену</text>';
                return;
            }
            
            try {
                let html = '';
                
                        if (walls.value.length === 1) {
                            const wallLength = walls.value[0];
                    const scale = Math.min(200 / wallLength, 0.8);
                    const scaledLength = wallLength * scale;
                    const startX = 50;
                    const startY = 100;
                    const endX = startX + scaledLength;
                    const endY = startY;
                    
                    html += `
                        <line x1="${startX}" y1="${startY}" x2="${endX}" y2="${endY}" class="room-wall"/>
                        <rect x="${startX + scaledLength * 0.3}" y="${startY - 6}" width="${scaledLength * 0.2}" height="12" 
                              fill="white" stroke="#0066FF" stroke-width="2" rx="2"/>
                        <text x="${startX + scaledLength * 0.4}" y="${startY + 15}" class="room-dimension" font-size="8">дверь</text>
                        <circle cx="${startX}" cy="${startY}" r="6" class="room-corner"/>

                        <text x="${startX}" y="${startY + 20}" class="room-label">A</text>
                        <text x="${endX}" y="${endY + 20}" class="room-label">B</text>
                        <text x="${startX + scaledLength/2}" y="${startY - 15}" class="room-dimension">${wallLength} см</text>
                    `;
                    
                    if (cornerType) {
                        let nextX, nextY;
                        const previewLength = 60;
                        
                        if (cornerType === 'inner') {
                            nextX = endX;
                                    nextY = endY - previewLength;
                        } else {
                            nextX = endX;
                                    nextY = endY + previewLength;
                        }
                        
                        html += `
                            <line x1="${endX}" y1="${endY}" x2="${nextX}" y2="${nextY}" 
                                  stroke="#FF8C00" stroke-width="3" stroke-dasharray="5,3"/>
                            <circle cx="${nextX}" cy="${nextY}" r="6" class="room-corner next"/>
                            <text x="${nextX + 15}" y="${nextY + 5}" class="room-label" fill="#FF8C00">C?</text>
                            <path d="M ${endX - 20} ${endY} A 20 20 0 0 ${cornerType === 'inner' ? '0' : '1'} ${endX} ${endY + (cornerType === 'inner' ? -20 : 20)}"
                                  stroke="${cornerType === 'inner' ? '#10B981' : '#F59E0B'}" 
                                  stroke-width="3" fill="none" stroke-dasharray="3,2"/>
                            <text x="${endX + 25}" y="${endY - 5}" class="room-dimension" 
                                  fill="${cornerType === 'inner' ? '#10B981' : '#F59E0B'}" font-weight="700">
                                ${cornerType === 'inner' ? '90°' : '270°'}
                            </text>
                        `;
                    }
                    
                    svg.innerHTML = html;
                    return;
                }
                
                        const points = calculateRoomPointsForPreview(walls.value, corners.value);
                
                if (points.length === 0) {
                    svg.innerHTML = '<text x="150" y="100" text-anchor="middle" class="room-label">Ошибка расчета</text>';
                    return;
                }
                
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    
                            if (isNaN(p1.x) || isNaN(p1.y) || isNaN(p2.x) || isNaN(p2.y)) continue;
                    
                    html += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" class="room-wall"/>`;
                    
                    if (i === 0 && p2.x > p1.x) {
                        const doorStart = p1.x + (p2.x - p1.x) * 0.3;
                        const doorWidth = (p2.x - p1.x) * 0.2;
                        html += `
                            <rect x="${doorStart}" y="${p1.y - 6}" width="${doorWidth}" height="12" 
                                  fill="white" stroke="#0066FF" stroke-width="2" rx="2"/>
                            <text x="${doorStart + doorWidth/2}" y="${p1.y + 15}" class="room-dimension" font-size="8">дверь</text>
                        `;
                    }
                    
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    const offsetY = i % 2 === 0 ? -15 : 20;
                    
                    if (!isNaN(midX) && !isNaN(midY)) {
                                html += `<text x="${midX}" y="${midY + offsetY}" class="room-dimension">${walls.value[i]}</text>`;
                    }
                }
                
                points.forEach((point, i) => {
                            if (isNaN(point.x) || isNaN(point.y)) return;
                    const isLast = i === points.length - 1;
                    html += `
                        <circle cx="${point.x}" cy="${point.y}" r="6" class="room-corner ${isLast ? 'active' : ''}"/>
                        <text x="${point.x}" y="${point.y + (i % 2 === 0 ? 20 : -10)}" class="room-label">
                            ${String.fromCharCode(65 + i)}
                        </text>
                    `;
                });
                
                if (cornerType && points.length >= 2) {
                    const lastPoint = points[points.length - 1];
                    const secondLastPoint = points[points.length - 2];
                    
                    if (!isNaN(lastPoint.x) && !isNaN(lastPoint.y) && !isNaN(secondLastPoint.x) && !isNaN(secondLastPoint.y)) {
                        const dx = lastPoint.x - secondLastPoint.x;
                        const dy = lastPoint.y - secondLastPoint.y;
                        const currentAngle = Math.atan2(dy, dx);
                        
                        let nextAngle;
                        if (cornerType === 'inner') {
                                    nextAngle = currentAngle + Math.PI / 2;
                        } else {
                                    nextAngle = currentAngle - Math.PI / 2;
                        }
                        
                        const previewLength = 60;
                        const nextX = lastPoint.x + Math.cos(nextAngle) * previewLength;
                        const nextY = lastPoint.y + Math.sin(nextAngle) * previewLength;
                        
                        if (!isNaN(nextX) && !isNaN(nextY)) {
                            html += `
                                <line x1="${lastPoint.x}" y1="${lastPoint.y}" x2="${nextX}" y2="${nextY}"

                                <text x="${nextX + 15}" y="${nextY + 5}" class="room-label" fill="#FF8C00">
                                    ${String.fromCharCode(65 + points.length)}?
                                </text>

                            const arcRadius = 25;
                            const startX = lastPoint.x + Math.cos(currentAngle - Math.PI) * arcRadius;
                            const startY = lastPoint.y + Math.sin(currentAngle - Math.PI) * arcRadius;
                            const endX = lastPoint.x + Math.cos(nextAngle) * arcRadius;
                            const endY = lastPoint.y + Math.sin(nextAngle) * arcRadius;
                            
                            if (!isNaN(startX) && !isNaN(startY) && !isNaN(endX) && !isNaN(endY)) {
                                const sweepFlag = cornerType === 'inner' ? 1 : 0;
                                html += `
                                    <path d="M ${startX} ${startY} A ${arcRadius} ${arcRadius} 0 0 ${sweepFlag} ${endX} ${endY}"
                                          stroke="${cornerType === 'inner' ? '#10B981' : '#F59E0B'}" 
                                          stroke-width="3" fill="none" stroke-dasharray="3,2"/>
                                    <text x="${lastPoint.x + 30}" y="${lastPoint.y - 10}" class="room-dimension" 
                                          fill="${cornerType === 'inner' ? '#10B981' : '#F59E0B'}" font-weight="700">
                                        ${cornerType === 'inner' ? '90°' : '270°'}
                                    </text>
                                `;
                            }
                        }
                    }
                }
                
                svg.innerHTML = html;
            } catch (error) {
                console.error('Error drawing corner preview:', error);
                svg.innerHTML = '<text x="150" y="100" text-anchor="middle" class="room-label">Ошибка отображения</text>';
            }
        }

        function drawNextWallPreview(newLength = null) {
                    const svg = nextWallPreview.value;
                    if (!svg) return;
            
                    const testWalls = [...walls.value];
                    const testCorners = [...corners.value];

            let html = '';
            
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i + 1];

                html += `
                    <line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" 
                          stroke="${isNew ? '#FF8C00' : '#0066FF'}" 
                          stroke-width="${isNew ? '4' : '3'}"
                          stroke-dasharray="${isNew ? '6,4' : 'none'}"/>
                `;
                
                if (i === 0) {
                    const doorStart = p1.x + (p2.x - p1.x) * 0.3;
                    const doorWidth = (p2.x - p1.x) * 0.2;
                    html += `
                        <rect x="${doorStart}" y="${p1.y - 6}" width="${doorWidth}" height="12" 
                              fill="white" stroke="#0066FF" stroke-width="2" rx="2"/>
                    `;
                }
                
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                        const length = i < walls.value.length ? walls.value[i] : newLength;
                
                if (length) {
                    html += `
                        <circle cx="${midX}" cy="${midY}" r="12" fill="white" stroke="${isNew ? '#FF8C00' : '#0066FF'}" stroke-width="2"/>
                        <text x="${midX}" y="${midY + 3}" class="room-dimension" fill="${isNew ? '#FF8C00' : '#0066FF'}">${length}</text>
                    `;

            }
            
            points.forEach((point, i) => {
                const isActive = i === points.length - 1;
                html += `
                    <circle cx="${point.x}" cy="${point.y}" r="6" 
                            class="room-corner ${isActive ? 'active' : ''}"/>
                    <text x="${point.x + (i % 2 === 0 ? 10 : -10)}" y="${point.y + (i % 2 === 0 ? -10 : 20)}" class="room-label">

            svg.innerHTML = html;

        function drawDiagonalPreview(diagonalLength = null) {
                    const svg = diagonalPreview.value;
                    if (!svg) return;
            
                    const points = calculateRoomPointsForPreview(walls.value, corners.value);
            let html = '';
            
            for (let i = 0; i < points.length; i++) {

                html += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" class="room-wall"/>`;
                
                if (i === 0) {

                    html += `

            }
            
            if (points.length > 2) {
                const from = points[0];
                const to = points[Math.floor(points.length / 2)];
                
                html += `
                    <line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" 
                          class="diagonal-line"/>
                    <circle cx="${from.x}" cy="${from.y}" r="8" fill="#FF8C00" stroke="white" stroke-width="2"/>
                    <circle cx="${to.x}" cy="${to.y}" r="8" fill="#FF8C00" stroke="white" stroke-width="2"/>
                `;
                
                if (diagonalLength) {
                    const midX = (from.x + to.x) / 2;
                    const midY = (from.y + to.y) / 2;
                    html += `
                        <rect x="${midX - 25}" y="${midY - 10}" width="50" height="20" 
                              fill="white" stroke="#FF8C00" stroke-width="2" rx="6"/>

            points.forEach((point, i) => {

                html += `

        function drawResultPreview() {

            let html = '';

                if (i < points.length) {

                    const midY = (p1.y + p2.y) / 2;
                    const dx = p2.y - p1.y;
                    const dy = p1.x - p2.x;
                    const len = Math.sqrt(dx*dx + dy*dy) || 1;
                    const offsetX = (dx / len) * 15;
                    const offsetY = (dy / len) * 15;
                    
                    html += `
                        <rect x="${midX + offsetX - 20}" y="${midY + offsetY - 8}" width="40" height="16" 
                              fill="white" stroke="#0066FF" stroke-width="1" rx="4"/>
                        <text x="${midX + offsetX}" y="${midY + offsetY + 3}" class="room-dimension">${length}</text>
                    `;
                }
            });
            
            points.forEach((point, i) => {
                html += `
                    <circle cx="${point.x}" cy="${point.y}" r="4" fill="white" stroke="#0066FF" stroke-width="2"/>
                    <text x="${point.x + 10}" y="${point.y - 10}" class="room-label">
                        ${String.fromCharCode(65 + i)}

                function calculateRoomPointsForPreview(useWalls = null, useCorners = null) {
                    const wallsToUse = useWalls || walls.value;
                    const cornersToUse = useCorners || corners.value;
            
                    if (wallsToUse.length === 0) return [];
                    
                    const points = [{ x: 50, y: 100 }];
                    let currentAngle = 0;
                    let currentX = 50;
                    let currentY = 100;
                    
                    const maxWall = Math.max(...wallsToUse);
                    const scale = Math.min(200 / maxWall, 0.8);
                    
                    for (let i = 0; i < wallsToUse.length; i++) {
                        const wallLength = wallsToUse[i];
                        
                        if (!wallLength || wallLength <= 0 || isNaN(wallLength)) continue;
                        
                        const scaledLength = wallLength * scale;
                        const deltaX = Math.cos(currentAngle) * scaledLength;
                        const deltaY = Math.sin(currentAngle) * scaledLength;
                        
                        if (isNaN(deltaX) || isNaN(deltaY)) break;
                        
                        currentX += deltaX;
                        currentY += deltaY;
                        
                        if (isNaN(currentX) || isNaN(currentY)) break;
                        
                        points.push({ x: currentX, y: currentY });
                        
                        if (i < cornersToUse.length) {
                            if (cornersToUse[i] === 'inner') {
                                currentAngle += Math.PI / 2;
                            } else if (cornersToUse[i] === 'outer') {
                                currentAngle -= Math.PI / 2;
                            }
                            currentAngle = currentAngle % (2 * Math.PI);
                        }
                    }
            
                    return points.filter(point => {
                return !isNaN(point.x) && !isNaN(point.y) && 
                       isFinite(point.x) && isFinite(point.y);
            });
                }

                                </div>

                                <div class="helper-text">
                                    <span class="icon">🧭</span>
                                    Внутренний угол - обычный угол комнаты. Внешний угол - выступ или ниша
                                </div>
                            </div>

                            <div class="action-section">
                                <div class="action-buttons">
                                    <button class="btn secondary" 
                                            v-if="showFinishFromCorner" 
                                            @click="handleFinishRoomFromCorner">
                                        {{ walls.length >= 4 ? 'Завершить комнату' : 'Завершить (минимум)' }}
                                    </button>
                                    <button class="btn primary" 
                                            :disabled="!selectedCorner" 
                                            @click="handleCornerNext">
                                        Далее
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M5 12h14M12 5l7 7-7 7"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Step 3: Next wall -->
                        <div class="step-container" :class="{ active: currentStep === 'next-wall' }" data-step="next-wall">
                            <div class="step-content">
                                <div class="step-header">
                                    <div class="step-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="4" width="18" height="2"/>
                                            <rect x="3" y="18" width="18" height="2"/>
                                            <rect x="11" y="6" width="2" height="12"/>
                                        </svg>
                                    </div>
                                    <h2 class="step-title">{{ nextWallTitle }}</h2>
                                    <p class="step-subtitle">{{ nextWallSubtitle }}</p>
                                </div>

                                <div class="preview-area">
                                    <svg class="preview-svg" ref="nextWallPreview" viewBox="0 0 300 200"></svg>
                                </div>

                                <div class="input-section">
                                    <div class="input-wrapper">
                                        <input type="number" 
                                               class="input-field" 
                                               :class="{ error: nextWallError }"
                                               v-model="nextWallInput" 
                                               @input="handleNextWallInput"
                                               placeholder="300" 
                                               min="50" 
                                               max="2000">
                                        <div class="input-unit">сантиметры</div>
                                        <div class="input-hint">Введите длину стены в сантиметрах</div>
                                    </div>
                                </div>
                            </div>

                            <div class="action-section">
                                <div class="action-buttons">
                                    <button class="btn secondary" @click="handleFinishRoom">Завершить комнату</button>
                                    <button class="btn primary" :disabled="!nextWallValid" @click="handleNextWallNext">
                                        Далее
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M5 12h14M12 5l7 7-7 7"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Step 4: Diagonal -->
                        <div class="step-container" :class="{ active: currentStep === 'diagonal' }" data-step="diagonal">
                            <div class="step-content">
                                <div class="step-header">
                                    <div class="step-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 3L3 21M8 3h13v13"/>
                                        </svg>
                                    </div>
                                    <h2 class="step-title">Диагональ</h2>
                                    <p class="step-subtitle">Для точности измерьте диагональ комнаты</p>
                                </div>

                                <div class="preview-area">
                                    <svg class="preview-svg" ref="diagonalPreview" viewBox="0 0 300 200"></svg>
                                </div>

                                <div class="input-section">
                                    <div class="input-wrapper">
                                        <input type="number" 
                                               class="input-field" 
                                               :class="{ error: diagonalError }"
                                               v-model="diagonalInput" 
                                               @input="handleDiagonalInput"
                                               placeholder="400" 
                                               min="100" 
                                               max="3000">
                                        <div class="input-unit">сантиметры</div>
                                        <div class="input-hint">Измерьте от угла до угла</div>
                                    </div>
                                </div>

                                <div class="helper-text">
                                    <span class="icon">📐</span>
                                    Диагональ помогает точно рассчитать форму комнаты. Можете пропустить для простых комнат
                                </div>
                            </div>

                            <div class="action-section">
                                <div class="action-buttons">
                                    <button class="btn secondary" @click="handleSkipDiagonal">Пропустить</button>
                                    <button class="btn primary" :disabled="!diagonalValid" @click="handleDiagonalNext">
                                        Готово
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M20 6L9 17l-5-5"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Step 5: Result -->
                        <div class="step-container" :class="{ active: currentStep === 'result' }" data-step="result">
                            <div class="step-content">
                                <div class="step-header">
                                    <div class="step-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/>
                                        </svg>
                                    </div>
                                    <h2 class="step-title">Замер завершён!</h2>
                                    <p class="step-subtitle">Ваша комната успешно измерена и рассчитана</p>
                                </div>

                                <div class="preview-area">
                                    <svg class="preview-svg" ref="resultPreview" viewBox="0 0 300 200"></svg>
                                </div>

                                <div class="result-grid">
                                    <div class="result-card">
                                        <div class="result-value">{{ resultPerimeter }}</div>
                                        <div class="result-label">Периметр (м)</div>
                                    </div>
                                    <div class="result-card">
                                        <div class="result-value">{{ resultArea }}</div>
                                        <div class="result-label">Площадь (м²)</div>
                                    </div>
                                </div>
                            </div>

                            <div class="action-section">
                                <div class="action-buttons">
                                    <button class="btn secondary" @click="restartApp">Новый замер</button>
                                    <button class="btn primary" @click="shareResults">
                                        Поделиться
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
